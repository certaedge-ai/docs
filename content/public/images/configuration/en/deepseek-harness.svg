<rect x="350" y="436" width="260" height="62" rx="8" fill="#241d2d" stroke="#b997ff" stroke-opacity=".55"/>
<text class="step" x="480" y="474" text-anchor="middle">02  Set URL and model</text>
<path d="M620 467H650" stroke="#b997ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="436" width="260" height="62" rx="8" fill="#241d2d" stroke="#b997ff" stroke-opacity=".55"/>
<text class="step" x="790" y="474" text-anchor="middle">03  Test and check logs</text>
<text x="40" y="539" font-size="15" style="fill:#a5a2a5">No real keys are shown. Check your CertaEdge console for models and permissions.</text></svg>
