<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#f1f0ec}.label{font-size:18px;fill:#c5becf}.value{font-size:21px}.step{font-size:18px;font-weight:600}</style>
<rect width="960" height="570" rx="16" fill="#1c1624"/>
<text x="40" y="43" fill="#b997ff" style="fill:#b997ff;font-size:13px;letter-spacing:2px">CERTAEDGE / CONNECTION GUIDE</text>
<title id="title">DeepSeek Harness connection fields</title><desc id="description">CertaEdge connection fields. This is a diagram, not a tested software screenshot.</desc>
<text x="40" y="90" font-size="30" font-weight="600">DeepSeek Harness connection fields</text>
<text x="40" y="121" font-size="15" style="fill:#a5a2a5">Field diagram · Not a software screenshot · Settings depend on your version</text>
<rect x="40" y="145" width="880" height="55" rx="7" fill="#2d2734"/>
<text class="label" x="60" y="180">Settings path</text>
<text class="value" x="315" y="180">Settings → Models → Custom model API</text>
<rect x="40" y="210" width="880" height="55" rx="7" fill="#2d2734"/>
<text class="label" x="60" y="245">Provider ID</text>
<text class="value" x="315" y="245">certaedge</text>
<rect x="40" y="275" width="880" height="55" rx="7" fill="#2d2734"/>
